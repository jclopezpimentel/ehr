serviceEndpoints:
  httpbin:
    url: 'https://httpbin.org'

  entities:
    url: 'http://172.18.1.4:5501'

#  didentity:
#    url: 'http://172.18.1.5:5502'
#
  birthcertificate:
    url: 'http://172.18.1.5:5502'

policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
pipelines:

  default:
    apiEndpoints:
      - api
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: httpbin 
              changeOrigin: true


  entitiesPipeline:
